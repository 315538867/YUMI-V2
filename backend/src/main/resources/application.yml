spring:
  application:
    name: yumi-backend
  datasource:
    url: ${YUMI_DB_URL:jdbc:mysql://localhost:3306/yumi_v2?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${YUMI_DB_USERNAME:yumi}
    password: ${YUMI_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${YUMI_SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

logging:
  level:
    root: INFO

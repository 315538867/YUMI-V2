<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YUMI V2 · 客户</title>
  <link rel="stylesheet" href="assets/vendor/element-plus-2.11.5/index.css" />
  <script src="assets/vendor/vue-3.5.22/vue.global.prod.js"></script>
  <script src="assets/vendor/element-plus-2.11.5/index.full.min.js"></script>
  <script src="assets/vendor/icons-vue-2.3.2/index.iife.min.js"></script>
  <script src="payment-vouchers.js"></script>
  <script src="order-finance-store.js"></script>
  <script src="customer-store.js"></script>
  <style>
    :root{--ink:#20352d;--muted:#718078;--line:#e1e9e3;--canvas:#f5f7f5;--accent:#2f6f57;--soft:#edf4ef;--el-color-primary:#2f6f57;--el-color-success:#2f6f57;--el-color-warning:#b67a35;--el-color-danger:#a85b50;--el-color-info:#718078;--el-border-radius-base:5px}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px}[v-cloak]{display:none}button,input,textarea{font-family:inherit}a{color:var(--accent);text-decoration:none}
    .app-shell{min-height:100vh;padding-left:76px}.rail{position:fixed;inset:0 auto 0 0;width:76px;background:#1c3329;display:flex;align-items:center;flex-direction:column;z-index:5}.brand{width:36px;height:36px;margin:18px 0 29px;border-radius:9px;background:#b9d4c1;color:#18372a;font-size:16px;font-weight:700;display:grid;place-items:center}.rail-nav{display:flex;flex-direction:column;gap:10px}.rail-btn{border:0;background:none;color:#91aa9a;border-radius:9px;width:43px;height:43px;display:grid;place-items:center;cursor:pointer;font-size:18px}.rail-btn:hover,.rail-btn.active{background:#2d5040;color:#d9e9de}.rail-footer{margin-top:auto;padding:25px 0;color:#90a898;font-size:11px}
    .topbar{height:69px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px;display:flex;align-items:center;justify-content:space-between}.breadcrumb{color:var(--muted)}.breadcrumb strong{color:var(--ink);font-size:16px;margin-left:12px}.topbar-meta{display:flex;align-items:center;gap:16px}.administrator{display:flex;align-items:center;gap:8px;color:var(--muted)}.administrator .el-avatar{background:#bec4ca}
    .workspace{max-width:1450px;margin:auto;padding:26px 30px 40px}.heading{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:21px}.heading-copy{display:flex;align-items:center;gap:16px}.heading h1{font-size:25px;margin:0}.heading p{margin:0;color:var(--muted)}.divider{color:#c5d1c9;font-size:24px}.heading-actions{display:flex;gap:8px}.back-link{display:flex;align-items:center;gap:7px;border:0;background:none;padding:0;margin-bottom:20px;color:var(--muted);cursor:pointer;font-size:13px}
    .list-card,.form-card,.detail-card{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}.customer-toolbar{display:flex;align-items:center;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}.customer-toolbar .keyword{width:330px}.filter-field{display:flex;align-items:center;gap:9px;white-space:nowrap;color:var(--muted)}.filter-field .el-select{width:135px}.result-count{margin-left:auto;color:var(--muted);font-size:12px}.result-count strong{color:var(--ink);margin:0 3px}.table-wrap{padding:0 20px}.el-table{--el-table-header-bg-color:#f8faf8;--el-table-border-color:#e7ede8;color:var(--ink);font-size:12px}.el-table th.el-table__cell{font-size:11px;font-weight:500;color:var(--muted);height:44px}.el-table .el-table__cell{padding:16px 0}.customer-name{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer}.cell-sub{display:block;margin-top:5px;font-size:11px;color:var(--muted)}.row-actions{display:flex;gap:12px}.row-actions .el-button{margin:0;font-size:12px}.list-footer{display:flex;align-items:center;justify-content:space-between;padding:17px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.prototype-note{color:var(--muted);font-size:12px;line-height:1.8;margin:16px 1px 0}
    .content-grid{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:20px;align-items:start}.main-column{display:grid;gap:18px}.section-header{display:flex;align-items:center;justify-content:space-between;padding:19px 20px;border-bottom:1px solid var(--line)}.section-header h2{font-size:14px;margin:0}.section-header span{color:var(--muted);font-size:11px}.section-body{padding:22px 20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px}.wide{grid-column:1/-1}.el-form-item{margin-bottom:20px}.el-form-item__label{font-size:12px;color:#355542;padding-bottom:7px!important}.field-hint{display:block;font-size:11px;color:var(--muted);line-height:1.7;margin-top:7px}.preview-card{border:1px solid #dfebe2;border-radius:8px;background:var(--soft);padding:22px 20px}.preview-card h2{font-size:14px;margin:0 0 20px}.customer-avatar{height:48px;width:48px;display:grid;place-items:center;background:#d8e9dc;border-radius:10px;color:#43694f;font-size:21px}.preview-name{font-size:17px;font-weight:600;margin:15px 0 7px;overflow-wrap:anywhere}.preview-no{color:var(--muted);font-size:12px}.preview-line{display:flex;justify-content:space-between;gap:10px;margin:13px 0;font-size:12px}.preview-line span:first-child{color:var(--muted)}.preview-card hr{border:0;border-top:1px solid #d6e4da;margin:21px 0}.preview-card p{font-size:12px;color:var(--muted);line-height:1.9;margin:0}.form-actions{display:flex;gap:10px;justify-content:flex-end;padding:17px 20px;border-top:1px solid var(--line)}
    .info-grid{display:grid;grid-template-columns:110px 1fr;gap:18px 15px;margin:0;font-size:13px;line-height:1.7}.info-grid dt{color:var(--muted)}.info-grid dd{margin:0;overflow-wrap:anywhere;white-space:pre-wrap}.dialog-copy{line-height:1.9;color:var(--muted);margin:0 0 18px}.confirm-tip{padding:12px 14px;margin-top:22px;background:#f1f6f2;color:#557463;font-size:12px;line-height:1.8;border-radius:6px}.dialog-actions{display:flex;justify-content:flex-end;gap:10px}.dialog-actions .el-button+.el-button{margin-left:0}.empty-copy{color:var(--muted)}
    @media(max-width:1050px){.heading-copy{align-items:flex-start;flex-direction:column;gap:8px}.heading-copy .divider{display:none}.result-count{width:100%;margin-left:0}.content-grid{grid-template-columns:minmax(0,1fr) 225px}}
    @media(max-width:800px){.workspace{padding:20px 16px}.topbar{padding:0 16px}.content-grid{grid-template-columns:1fr}.preview-card{order:2}.heading{align-items:flex-start}.heading-actions{flex-wrap:wrap;justify-content:flex-end}.form-grid{grid-template-columns:1fr}.customer-toolbar .keyword{width:100%}.list-footer{gap:14px;flex-wrap:wrap}}
  </style>
</head>
<body>
<div id="app" class="app-shell" v-cloak>
  <aside class="rail">
    <div class="brand">YU</div>
    <nav class="rail-nav" aria-label="模块导航">
      <a class="rail-btn" href="production-element-plus.html" title="生产作业" @click.prevent="goModule('production-element-plus.html')"><el-icon><Operation></Operation></el-icon></a>
      <a class="rail-btn" href="product-element-plus.html" title="商品" @click.prevent="goModule('product-element-plus.html')"><el-icon><Goods></Goods></el-icon></a>
      <a class="rail-btn" href="workforce-element-plus.html" title="人员与小组" @click.prevent="goModule('workforce-element-plus.html')"><el-icon><UserFilled></UserFilled></el-icon></a>
      <button class="rail-btn active" title="客户" @click="requestLeave()"><el-icon><User></User></el-icon></button>
      <a class="rail-btn" href="orders-element-plus.html" title="订单" @click.prevent="goOrders()"><el-icon><Tickets></Tickets></el-icon></a>
      <a class="rail-btn" href="finance-element-plus.html" title="财务结算" @click.prevent="goModule('finance-element-plus.html')"><el-icon><DataAnalysis></DataAnalysis></el-icon></a>
    </nav>
    <div class="rail-footer">一期</div>
  </aside>
  <header class="topbar"><div class="breadcrumb">工作台 / <strong>客户</strong></div><div class="topbar-meta"><el-tag effect="plain" size="small">主数据 · 客户</el-tag><div class="administrator"><el-avatar :size="26">管</el-avatar><span>管理员</span></div></div></header>
  <main class="workspace">
    <template v-if="pageMode==='list'">
      <div class="heading"><div class="heading-copy"><h1>客户</h1><span class="divider">/</span><p>联系人与默认收货资料</p></div><el-button type="primary" @click="createCustomer"><el-icon><Plus></Plus></el-icon>&nbsp;新建客户</el-button></div>
      <section class="list-card">
        <div class="customer-toolbar">
          <el-input v-model="filters.keyword" class="keyword" clearable placeholder="客户名称 / 编号 / 联系人 / 电话" aria-label="搜索客户"><template #prefix><el-icon><Search></Search></el-icon></template></el-input>
          <div class="filter-field"><span>状态</span><el-select v-model="filters.status" aria-label="客户状态"><el-option label="全部状态" value="ALL"></el-option><el-option label="启用" value="ACTIVE"></el-option><el-option label="停用" value="INACTIVE"></el-option></el-select></div>
          <el-button @click="resetFilters">重置</el-button>
          <span class="result-count">共 <strong>{{filteredCustomers.length}}</strong> 位客户 · 启用 {{activeCount}} 位</span>
        </div>
        <div class="table-wrap"><el-table :data="pagedCustomers" row-key="id" empty-text="没有符合条件的客户">
          <el-table-column label="客户 / 编号" min-width="175"><template #default="scope"><button class="customer-name" @click="openCustomer(scope.row)">{{scope.row.name}}</button><span class="cell-sub">{{scope.row.no}}</span></template></el-table-column>
          <el-table-column prop="contact" label="联系人" min-width="90"></el-table-column>
          <el-table-column prop="phone" label="联系电话" min-width="130"></el-table-column>
          <el-table-column prop="address" label="默认收货地址" min-width="210" show-overflow-tooltip></el-table-column>
          <el-table-column label="状态" width="78"><template #default="scope"><el-tag :type="scope.row.status==='ACTIVE'?'success':'info'" effect="plain" size="small">{{statusLabel(scope.row.status)}}</el-tag></template></el-table-column>
          <el-table-column label="操作" width="140" fixed="right"><template #default="scope"><div class="row-actions"><el-button link type="primary" @click="openCustomer(scope.row)">详情</el-button><el-button link type="primary" @click="editCustomer(scope.row)">编辑</el-button><el-button link :type="scope.row.status==='ACTIVE'?'warning':'primary'" @click="requestStatus(scope.row)">{{scope.row.status==='ACTIVE'?'停用':'恢复'}}</el-button></div></template></el-table-column>
        </el-table></div>
        <div class="list-footer"><span>停用客户保留在列表中，不删除历史资料。</span><el-pagination v-model:current-page="pagination.page" :page-size="pagination.pageSize" :total="filteredCustomers.length" layout="prev, pager, next"></el-pagination></div>
      </section>
      <p class="prototype-note">原型示例，客户资料保存于本地浏览器。通过客户 / 订单入口切换可联动，不调用真实接口，请勿录入真实敏感资料。</p>
    </template>

    <template v-else-if="pageMode==='detail'&&selectedCustomer">
      <button class="back-link" @click="backToList"><el-icon><ArrowLeft></ArrowLeft></el-icon>返回客户列表</button>
      <div class="heading"><div class="heading-copy"><h1>{{selectedCustomer.name}}</h1><el-tag :type="selectedCustomer.status==='ACTIVE'?'success':'info'" effect="plain">{{statusLabel(selectedCustomer.status)}}</el-tag></div><div class="heading-actions"><el-button @click="requestStatus(selectedCustomer)">{{selectedCustomer.status==='ACTIVE'?'停用客户':'恢复客户'}}</el-button><el-button @click="editCustomer(selectedCustomer)">编辑资料</el-button><el-button type="primary" :disabled="selectedCustomer.status!=='ACTIVE'" @click="goOrders(selectedCustomer)">新建订单</el-button></div></div>
      <div class="content-grid"><div class="main-column">
        <section class="detail-card"><div class="section-header"><h2>基本资料</h2><span>{{selectedCustomer.no}}</span></div><div class="section-body"><dl class="info-grid"><dt>客户名称</dt><dd>{{selectedCustomer.name}}</dd><dt>客户编号</dt><dd>{{selectedCustomer.no}}</dd><dt>联系人</dt><dd>{{selectedCustomer.contact}}</dd><dt>联系电话</dt><dd>{{selectedCustomer.phone}}</dd><dt>客户状态</dt><dd>{{statusLabel(selectedCustomer.status)}}</dd></dl></div></section>
        <section class="detail-card"><div class="section-header"><h2>默认收货信息</h2><span>用于新订单自动带入</span></div><div class="section-body"><dl class="info-grid"><dt>默认收货人</dt><dd>{{selectedCustomer.contact}}</dd><dt>收货电话</dt><dd>{{selectedCustomer.phone}}</dd><dt>收货地址</dt><dd>{{selectedCustomer.address}}</dd></dl><p class="prototype-note">订单可以填写本次收货信息，不会回写客户默认资料。</p></div></section>
      </div><aside class="preview-card"><h2>使用说明</h2><p>修改客户资料仅影响后续新订单，已确认订单保留当时的客户信息和收货约定。</p><hr /><p>停用后仅禁止新订单引用，不删除客户，不改变历史订单、收款或退款记录。</p><hr /><p>收款、退款仍在订单内操作，不在客户资料中登记。</p></aside></div>
    </template>

    <template v-else-if="pageMode==='create'||pageMode==='edit'">
      <button class="back-link" @click="requestLeave()"><el-icon><ArrowLeft></ArrowLeft></el-icon>{{pageMode==='edit'?'返回客户详情':'返回客户列表'}}</button>
      <div class="heading"><div class="heading-copy"><h1>{{pageMode==='edit'?'编辑客户':'新建客户'}}</h1><span class="divider">/</span><p>{{pageMode==='edit'?'维护当前资料，不覆盖历史订单':'建立可复用的客户与收货资料'}}</p></div><el-tag effect="plain" type="info">{{draftNo}}</el-tag></div>
      <el-form label-position="top" @submit.prevent="requestSave">
        <div class="content-grid"><div class="main-column">
          <section class="form-card"><div class="section-header"><h2>基本资料</h2><span>客户身份与联系方式</span></div><div class="section-body"><div class="form-grid">
            <el-form-item label="客户名称" required><el-input v-model="customerDraft.name" maxlength="80" placeholder="例如：花间礼物"></el-input><small class="field-hint">用于订单选择与客户资料展示。</small></el-form-item>
            <el-form-item label="客户编号"><el-input :model-value="draftNo" disabled></el-input><small class="field-hint">确认创建后自动生成，不可修改或复用。</small></el-form-item>
            <el-form-item label="联系人" required><el-input v-model="customerDraft.contact" maxlength="40" placeholder="填写联系人姓名"></el-input></el-form-item>
            <el-form-item label="联系电话" required><el-input v-model="customerDraft.phone" maxlength="30" placeholder="手机号或带区号的固定电话"></el-input></el-form-item>
          </div></div></section>
          <section class="form-card"><div class="section-header"><h2>默认收货信息</h2><span>可在每笔订单中单独调整</span></div><div class="section-body"><el-form-item label="默认收货地址" required><el-input v-model="customerDraft.address" type="textarea" :rows="3" maxlength="200" show-word-limit placeholder="填写省市、街道及详细地址"></el-input><small class="field-hint">默认收货人、收货电话使用上方联系人和联系电话。本次订单的调整不会修改这里。</small></el-form-item></div><div class="form-actions"><el-button @click="requestLeave()">取消</el-button><el-button type="primary" @click="requestSave">核对客户资料</el-button></div></section>
        </div><aside class="preview-card"><h2>客户资料预览</h2><div class="customer-avatar">{{customerDraft.name.trim().slice(0,1)||'客'}}</div><div class="preview-name">{{customerDraft.name.trim()||'尚未填写客户名称'}}</div><div class="preview-no">{{draftNo}}</div><hr /><div class="preview-line"><span>联系人</span><span>{{customerDraft.contact||'—'}}</span></div><div class="preview-line"><span>联系电话</span><span>{{customerDraft.phone||'—'}}</span></div><hr /><p>{{pageMode==='create'?'新建客户默认启用，确认前不会产生客户记录。':'此次修改不改变客户启用状态，也不会改写已确认订单。'}}</p></aside></div>
      </el-form>
    </template>
  </main>

  <el-dialog v-model="savePreviewVisible" :title="editingId?'确认修改客户资料':'确认新建客户'" width="560px" :close-on-click-modal="false"><dl class="info-grid"><dt>客户名称</dt><dd>{{customerDraft.name.trim()}}</dd><dt>联系人</dt><dd>{{customerDraft.contact.trim()}}</dd><dt>联系电话</dt><dd>{{customerDraft.phone.trim()}}</dd><dt>默认收货地址</dt><dd>{{customerDraft.address.trim()}}</dd></dl><div class="confirm-tip">{{editingId?'保存后新订单使用更新后的资料；历史订单信息保持不变。':'确认后生成客户编号并启用，之后可在订单中选择。'}}</div><template #footer><div class="dialog-actions"><el-button @click="savePreviewVisible=false">返回修改</el-button><el-button type="primary" @click="confirmSave">{{editingId?'确认保存':'确认创建'}}</el-button></div></template></el-dialog>
  <el-dialog v-model="statusVisible" :title="statusTarget?.status==='ACTIVE'?'停用客户':'恢复客户'" width="450px" :close-on-click-modal="false"><template v-if="statusTarget"><p class="dialog-copy">{{statusTarget.name}} · {{statusTarget.no}}</p><div class="confirm-tip">{{statusTarget.status==='ACTIVE'?'停用后仅禁止新订单引用。客户资料、历史订单与收付记录仍然保留。':'恢复后允许新订单再次选择此客户，不改变历史订单。'}}</div></template><template #footer><div class="dialog-actions"><el-button @click="statusVisible=false">取消</el-button><el-button type="primary" @click="confirmStatus">{{statusTarget?.status==='ACTIVE'?'确认停用':'确认恢复'}}</el-button></div></template></el-dialog>
  <el-dialog v-model="leaveVisible" title="离开客户编辑？" width="440px" :close-on-click-modal="false"><p class="dialog-copy">当前资料尚未确认保存，离开后不保留本次填写内容。已保存的客户资料不受影响。</p><template #footer><div class="dialog-actions"><el-button @click="leaveVisible=false;pendingNavigation=''">继续填写</el-button><el-button type="primary" @click="discardDraft">离开，不保存</el-button></div></template></el-dialog>
</div>
<script>
const {createApp,ref,reactive,computed,watch}=Vue;
const app=createApp({setup(){
  const store=window.YumiCustomerStore;
  const orderStore=window.YumiOrderStore;
  const customers=reactive(store.list());
  store.subscribe(()=>customers.splice(0,customers.length,...store.list()));
  const pageMode=ref('list');
  const selectedId=ref(null);
  const selectedCustomer=computed(()=>customers.find(record=>record.id===selectedId.value)||null);
  const filters=reactive({keyword:'',status:'ALL'});
  const pagination=reactive({page:1,pageSize:8});
  const filteredCustomers=computed(()=>customers.filter(record=>{
    const keyword=filters.keyword.trim().toLowerCase();
    return(!keyword||[record.name,record.no,record.contact,record.phone].some(value=>value.toLowerCase().includes(keyword)))&&(filters.status==='ALL'||record.status===filters.status);
  }));
  const pagedCustomers=computed(()=>filteredCustomers.value.slice((pagination.page-1)*pagination.pageSize,pagination.page*pagination.pageSize));
  const activeCount=computed(()=>customers.filter(record=>record.status==='ACTIVE').length);
  watch(()=>[filters.keyword,filters.status],()=>{pagination.page=1});
  watch(()=>filteredCustomers.value.length,()=>{pagination.page=Math.min(pagination.page,Math.max(1,Math.ceil(filteredCustomers.value.length/pagination.pageSize)))});
  function resetFilters(){Object.assign(filters,{keyword:'',status:'ALL'});pagination.page=1}
  function statusLabel(status){return status==='ACTIVE'?'启用':'停用'}
  function scrollTop(){window.scrollTo({top:0,behavior:'instant'})}
  function backToList(){pageMode.value='list';scrollTop()}
  function openCustomer(record){store.refresh();if(!customers.some(customer=>customer.id===record.id))return false;selectedId.value=record.id;pageMode.value='detail';scrollTop();return true}
  const customerDraft=reactive({name:'',contact:'',phone:'',address:''});
  const editingId=ref(null);
  const expectedVersion=ref(null);
  const draftNo=computed(()=>editingId.value?customers.find(record=>record.id===editingId.value)?.no||'—':'确认后自动生成');
  const savePreviewVisible=ref(false);
  const saveFingerprint=ref('');
  const leaveVisible=ref(false);
  const pendingNavigation=ref('');
  function resetPreview(){savePreviewVisible.value=false;saveFingerprint.value='';leaveVisible.value=false;pendingNavigation.value=''}
  function createCustomer(){store.refresh();Object.assign(customerDraft,{name:'',contact:'',phone:'',address:''});editingId.value=null;expectedVersion.value=null;selectedId.value=null;resetPreview();pageMode.value='create';scrollTop()}
  function editCustomer(record){
    store.refresh();const current=customers.find(customer=>customer.id===record.id);if(!current)return false;
    Object.assign(customerDraft,{name:current.name,contact:current.contact,phone:current.phone,address:current.address});editingId.value=current.id;expectedVersion.value=current.version;selectedId.value=current.id;resetPreview();pageMode.value='edit';scrollTop();return true;
  }
  function validateDraft(){
    store.refresh();const error=store.validate(customerDraft);if(error)return error;
    if(editingId.value&&customers.find(record=>record.id===editingId.value)?.version!==expectedVersion.value)return'客户资料已变化，请重新打开编辑后核对';
    return'';
  }
  function fingerprint(){return JSON.stringify({id:editingId.value,version:expectedVersion.value,fields:customerDraft})}
  function requestSave(){
    if(!['create','edit'].includes(pageMode.value))return false;
    const error=validateDraft();if(error){ElementPlus.ElMessage.error(error);return false}
    saveFingerprint.value=fingerprint();savePreviewVisible.value=true;return true;
  }
  function confirmSave(){
    if(!savePreviewVisible.value||!saveFingerprint.value||!['create','edit'].includes(pageMode.value))return false;
    const error=validateDraft();if(error||saveFingerprint.value!==fingerprint()){savePreviewVisible.value=false;saveFingerprint.value='';ElementPlus.ElMessage.warning(error||'客户资料已改变，请重新核对后确认');return false}
    try{
      const record=editingId.value?store.update(editingId.value,customerDraft,expectedVersion.value):store.create(customerDraft);
      resetPreview();openCustomer(record);ElementPlus.ElMessage.success(editingId.value?'客户资料已保存':'客户已创建');return true;
    }catch(error){savePreviewVisible.value=false;saveFingerprint.value='';ElementPlus.ElMessage.error(error.message);return false}
  }
  const statusVisible=ref(false);
  const statusTarget=ref(null);
  function requestStatus(record){
    store.refresh();const current=customers.find(customer=>customer.id===record.id);
    if(!current||current.version!==record.version){ElementPlus.ElMessage.warning('客户资料已变化，请重新查看后操作');return false}
    statusTarget.value={...current};statusVisible.value=true;return true;
  }
  function confirmStatus(){
    if(!statusVisible.value||!statusTarget.value)return false;
    try{const target=statusTarget.value;store.setStatus(target.id,target.status==='ACTIVE'?'INACTIVE':'ACTIVE',target.version);statusVisible.value=false;statusTarget.value=null;ElementPlus.ElMessage.success(target.status==='ACTIVE'?'客户已停用，历史订单保持不变':'客户已恢复');return true}
    catch(error){statusVisible.value=false;statusTarget.value=null;ElementPlus.ElMessage.warning(error.message);return false}
  }
  function requestLeave(destination=''){
    if(['create','edit'].includes(pageMode.value)){pendingNavigation.value=destination;leaveVisible.value=true;return false}
    if(destination)window.location.href=destination;else backToList();return true;
  }
  function discardDraft(){
    const destination=pendingNavigation.value;const wasEdit=pageMode.value==='edit';
    Object.assign(customerDraft,{name:'',contact:'',phone:'',address:''});resetPreview();pageMode.value=wasEdit&&selectedCustomer.value?'detail':'list';
    if(destination)window.location.href=destination;else scrollTop();return true;
  }
  function goModule(path,options={}){return requestLeave(store.navigationUrl(orderStore.navigationUrl(path,options)))}
  function goOrders(customer){
    if(customer){store.refresh();const current=customers.find(record=>record.id===customer.id);if(!current||current.status!=='ACTIVE'){ElementPlus.ElMessage.warning('停用客户不能用于新订单');return false}return goModule('orders-element-plus.html',{view:'create',customerId:current.id})}
    return goModule('orders-element-plus.html');
  }
  return{customers,pageMode,selectedCustomer,filters,pagination,filteredCustomers,pagedCustomers,activeCount,resetFilters,statusLabel,backToList,openCustomer,createCustomer,editCustomer,customerDraft,editingId,draftNo,savePreviewVisible,requestSave,confirmSave,statusVisible,statusTarget,requestStatus,confirmStatus,leaveVisible,pendingNavigation,requestLeave,discardDraft,goOrders,goModule};
}});
Object.entries(ElementPlusIconsVue).forEach(([name,component])=>app.component(name,component));
app.use(ElementPlus).mount('#app');
</script>
</body>
